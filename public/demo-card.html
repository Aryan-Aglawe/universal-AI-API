<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demo business card</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07111f;color:#edf4ff;font-family:system-ui}main{text-align:center;padding:24px}canvas{max-width:100%;height:auto;border-radius:16px;border:1px solid #55e6a5;box-shadow:0 18px 60px #0008}button{margin-top:22px;padding:12px 18px;border:0;border-radius:9px;background:#55e6a5;color:#062014;font-weight:800;font-size:16px;cursor:pointer}p{color:#b9c9dc}</style></head><body><main><canvas id="card" width="1200" height="700"></canvas><p>Download this PNG, then upload it in Business Card Scanner → Manage.</p><button id="download">Download sample business-card PNG</button></main><script>const c=document.querySelector('#card'),x=c.getContext('2d');x.fillStyle='#07111f';x.fillRect(0,0,1200,700);x.fillStyle='#0d1b2d';x.beginPath();x.roundRect(35,35,1130,630,30);x.fill();x.strokeStyle='#55e6a5';x.lineWidth=4;x.stroke();x.fillStyle='#55e6a5';x.fillRect(90,105,16,490);x.font='700 31px Arial';x.letterSpacing='5px';x.fillText('UNIVERSAL AI LABS',150,190);x.fillStyle='#edf4ff';x.font='700 72px Arial';x.fillText('Aryan Aglawe',150,300);x.fillStyle='#b9c9dc';x.font='34px Arial';x.fillText('AI Developer',155,360);x.strokeStyle='#314763';x.lineWidth=2;x.beginPath();x.moveTo(150,410);x.lineTo(1080,410);x.stroke();x.fillStyle='#edf4ff';x.font='31px Arial';x.fillText('+91 98765 43210',155,475);x.fillText('aryan@universalailabs.com',155,530);x.fillText('www.universalailabs.com',155,585);document.querySelector('#download').onclick=()=>{const a=document.createElement('a');a.download='demo-business-card.png';a.href=c.toDataURL('image/png');a.click()}</script></body></html>
